name: Build, test, notify

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write   # push the version tag
  packages: write   # push the image to GHCR

env:
  SERVICE_NAME: hqg-backtester
  IMAGE: ghcr.io/husky-quantitative-group/hqg-backtester

# one release at a time, so two merges can't read the same last tag
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: make test

  release:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Determine bump type from PR labels
        id: bump
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if jq -e 'index("breaking")' <<< "$LABELS" >/dev/null; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif jq -e 'index("feature")' <<< "$LABELS" >/dev/null; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next semver
        id: semver
        env:
          BUMP: ${{ steps.bump.outputs.type }}
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "v0.0.0")
          IFS=. read -r major minor patch <<< "${last#v}"
          case "$BUMP" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          echo "semver=$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push build image
        uses: docker/build-push-action@v6
        id: build
        with:
          push: true
          tags: ${{ env.IMAGE }}:build-${{ github.run_id }}
          labels: org.opencontainers.image.revision=${{ github.event.pull_request.merge_commit_sha }}

      - name: Compute version from image hash
        id: tag
        env:
          SEMVER: ${{ steps.semver.outputs.semver }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # DIGEST looks like sha256:<64 hex chars>; take the first 12 for a short, readable tag
          short_hash=$(cut -c8-19 <<< "$DIGEST")
          version="${SEMVER}-${short_hash}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Add the version tag to the same image
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker buildx imagetools create -t "${IMAGE}:${VERSION}" "${IMAGE}@${DIGEST}"

      - name: Tag release
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

  notify-hqg-deployment:
    needs: release
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      # PLACEHOLDER: TBD_APP_ID / TBD_APP_KEY are placeholders until the GitHub App exists.
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.TBD_APP_ID }}
          private-key: ${{ secrets.TBD_APP_KEY }}
          owner: Husky-Quantitative-Group
          repositories: hqg-deployment

      - name: Tell hqg-deployment a new version is ready
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/Husky-Quantitative-Group/hqg-deployment/dispatches \
            -f event_type=service-released \
            -F "client_payload[service]=${SERVICE_NAME}" \
            -F "client_payload[version]=${VERSION}" \
            -F "client_payload[repo]=${{ github.repository }}" \
            -F "client_payload[pr_url]=${{ github.event.pull_request.html_url }}" \
            -F "client_payload[merge_commit]=${{ github.event.pull_request.merge_commit_sha }}" \
            -F "client_payload[build_run]=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
