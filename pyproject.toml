[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hqg-backtester"
version = "0.1.0"
description = "Command line client for the HQG backtesting service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "hqg-algorithms>=1.0.1",
    "hqg-datafeed>=0.1.0",
    "matplotlib>=3.8",
    "fastapi>=0.128.0",
    "uvicorn==0.32.0",
    "pydantic==2.10.0",
    "pydantic_settings",
    "numpy",
    "pandas>=3.0",
    "yfinance",
    "requests",
    "cvxpy",
    "pyarrow",
    "fastparquet",
    "PyJWT",
    "cryptography",
]

[project.scripts]
hqg = "hqg_cli.main:main"

[project.urls]
Homepage = "https://github.com/Husky-Quantitative-Group/hqg-backtester/"

# The CLI (cli/, installed as hqg_cli) and the service (src/) both ship in this
# distribution so the CLI can run backtests in-process. The service's runtime
# dependencies are declared above; 
[tool.setuptools]
packages = [
    "hqg_cli",
    "src",
]

# The directory is cli/, but it installs under a namespaced import name: a bare
# top-level `cli` package would shadow (or be shadowed by) any other installed
# package or local cli.py using that very common name.
[tool.setuptools.package-dir]
hqg_cli = "cli"
src = "src"
